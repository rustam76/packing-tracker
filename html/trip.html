<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-50 dark:hover:bg-zinc-900 transition-colors active:scale-95 transition-transform duration-150">

<p class="font-body-sm text-body-sm text-outline">Jul 15 - Jul 28</p>
</div>
<div class="bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-full">
<span class="font-label-caps text-label-caps">85% Packed</span>
</div>
</div>
<div class="w-full bg-slate-100 dark:bg-zinc-800 h-1.5 rounded-full overflow-hidden">
<div class="bg-primary h-full w-[85%] rounded-full transition-all duration-500"></div>
</div>
</div>
</div>
</section>
<!-- Upcoming & Past (Asymmetric Layout) -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Tokyo Adventure (Upcoming) -->
<div class="flex flex-col bg-white dark:bg-zinc-900 rounded-xl border border-slate-100 dark:border-zinc-800 shadow-sm p-md space-y-4 haptic-feedback">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-[20px]" data-icon="event">event</span>
<span class="font-label-caps text-label-caps text-secondary uppercase">Upcoming</span>
</div>
<div class="space-y-1">
<h3 class="font-h2 text-h2 text-on-surface leading-tight">Tokyo Adventure</h3>
<p class="font-body-sm text-body-sm text-outline">Oct 12 - Oct 22</p>
</div>
<div class="pt-2">
<div class="flex justify-between text-xs mb-1.5">
<span class="font-body-sm text-outline">Inventory Check</span>
<span class="font-body-sm text-on-surface">12%</span>
</div>
<div class="w-full bg-slate-100 dark:bg-zinc-800 h-1 rounded-full overflow-hidden">
<div class="bg-secondary h-full w-[12%] rounded-full"></div>
</div>
</div>
</div>

</div>
<div class="w-8 h-8 rounded-full border-2 border-white dark:border-zinc-900 bg-blue-100 flex items-center justify-center">

</div>
</div>
</section>

</div>

</button>
<!-- Trips (ACTIVE) -->
<button class="flex flex-col items-center justify-center text-blue-600 dark:text-blue-400 bg-blue-50/50 dark:bg-blue-900/20 rounded-xl px-5 py-1 active:scale-90 haptic-feedback transition-all duration-200">
<span class="material-symbols-outlined mb-1" data-icon="luggage" data-weight="fill">luggage</span>

<span class="material-symbols-outlined mb-1" data-icon="group">group</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Shared</span>
</button>
<!-- Settings -->
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-zinc-500 px-3 py-1 hover:text-blue-500 transition-all active:scale-90 haptic-feedback">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Settings</span>
