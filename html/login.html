    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .tap-highlight-none {
        -webkit-tap-highlight-color: transparent;
      }

    <style>
      body {
        min-height: max(884px, 100dvh);
      }

          <p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">
            Sign in with your Google account to continue

        </div>
      </header>
      <main
        class="bg-surface-container-lowest border border-outline-variant p-lg rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.04)]"
      >
        <div class="flex flex-col items-center w-full">
          <button
            class="w-full flex items-center justify-center gap-3 bg-surface border border-outline-variant py-4 px-md rounded-xl hover:bg-surface-container-low active:scale-[0.98] transition-all shadow-sm"

            />
            <span class="font-h2 text-body-base font-semibold text-on-surface"
              >Continue with Google</span
            >
          </button>
        </div>
      </main>
      <footer class="text-center flex flex-col gap-lg">
        <p class="font-body-sm text-body-sm text-on-surface-variant">
          Don't have an account?
          <a class="text-primary font-semibold hover:underline" href="#"
            >Sign up</a
          >
        </p>
        <div
          class="relative w-full h-40 overflow-hidden rounded-2xl grayscale opacity-30 pointer-events-none"
        >
          <img
            class="w-full h-full object-cover"
            data-alt="minimalist clean open suitcase on a white floor with organized clothing and travel essentials in soft natural light"

          />
          <div
            class="absolute inset-0 bg-gradient-to-t from-surface via-transparent to-transparent"
          ></div>
        </div>

    </div>

</html>
