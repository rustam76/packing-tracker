<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#191b23",
                        "surface-container-highest": "#e1e2ec",
                        "on-surface-variant": "#424754",
                        "tertiary": "#924700",
                        "primary-fixed": "#d8e2ff",
                        "on-secondary-fixed-variant": "#8c0053",
                        "error-container": "#ffdad6",
                        "on-surface": "#191b23",
                        "surface-variant": "#e1e2ec",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#b75b00",
                        "surface-dim": "#d8d9e3",
                        "surface-bright": "#f9f9ff",
                        "secondary-fixed": "#ffd9e4",
                        "surface-container-low": "#f2f3fd",
                        "on-secondary-container": "#600037",
                        "primary-fixed-dim": "#adc6ff",
                        "surface": "#f9f9ff",
                        "primary-container": "#2170e4",
                        "background": "#f9f9ff",
                        "surface-container": "#ecedf7",
                        "surface-tint": "#005ac2",
                        "secondary-container": "#fd56a7",
                        "on-tertiary-fixed-variant": "#723600",
                        "tertiary-fixed-dim": "#ffb786",
                        "outline-variant": "#c2c6d6",
                        "secondary-fixed-dim": "#ffb0cd",
                        "inverse-surface": "#2e3038",
                        "inverse-primary": "#adc6ff",
                        "on-secondary-fixed": "#3e0022",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#001a42",
                        "on-tertiary-fixed": "#311400",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#fefcff",
                        "primary": "#0058be",
                        "on-error": "#ffffff",
                        "outline": "#727785",
                        "on-tertiary-container": "#fffbff",
                        "on-error-container": "#93000a",
                        "secondary": "#b4136d",
                        "inverse-on-surface": "#eff0fa",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#004395",
                        "tertiary-fixed": "#ffdcc6",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "gutter": "12px",
                        "sm": "8px",
                        "lg": "24px",
                        "xl": "32px",
                        "margin-mobile": "20px",
                        "base": "4px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "h2": ["Plus Jakarta Sans"],
                        "body-base": ["Inter"],
                        "h1": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-sm": ["14px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "400"}],
                        "h2": ["20px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-base": ["16px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}],
                        "h1": ["24px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .modal-overlay {
            background: rgba(25, 27, 35, 0.4);
            backdrop-filter: blur(8px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e1e2ec;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-base min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-5 h-16 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-md shadow-sm dark:shadow-none border-b border-slate-100 dark:border-zinc-800">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-blue-600 dark:text-blue-400" data-icon="travel">travel</span>
<h1 class="font-h2 text-h2 font-semibold text-slate-900 dark:text-zinc-100">Summer Trip 2024</h1>
</div>
<div class="flex items-center hover:bg-slate-50 dark:hover:bg-zinc-900 transition-colors rounded-full p-2 cursor-pointer active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-slate-400 dark:text-zinc-500" data-icon="expand_more">expand_more</span>
</div>
</header>
<!-- Main Content Canvas (Background Packing View) -->
<main class="pt-24 pb-24 px-margin-mobile max-w-md mx-auto space-y-lg">
<!-- Progress Summary -->
<div class="bg-surface-container-low rounded-xl p-md border border-outline-variant/30">
<div class="flex justify-between items-end mb-sm">
<span class="font-h2 text-body-sm font-semibold">Total Progress</span>
<span class="font-label-caps text-primary">65%</span>
</div>
<div class="h-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary w-[65%] rounded-full"></div>
</div>
</div>
<!-- Category Sections (Blurred Background) -->
<section class="space-y-md opacity-40 grayscale-[20%] pointer-events-none">
<h2 class="font-h2 text-h2">Essentials</h2>
<div class="space-y-sm">
<div class="bg-white rounded-lg p-md border border-slate-100 flex items-center gap-md shadow-sm">
<div class="w-6 h-6 border-2 border-outline-variant rounded-md"></div>
<span class="flex-1">Passport &amp; Visa</span>
<span class="px-2 py-1 bg-blue-50 text-blue-600 text-[10px] font-bold rounded uppercase">Docs</span>
</div>
<div class="bg-white rounded-lg p-md border border-slate-100 flex items-center gap-md shadow-sm">
<div class="w-6 h-6 border-2 border-outline-variant rounded-md"></div>
<span class="flex-1">Travel Insurance</span>
<span class="px-2 py-1 bg-blue-50 text-blue-600 text-[10px] font-bold rounded uppercase">Docs</span>
</div>
</div>
</section>
</main>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-[60] modal-overlay flex items-end md:items-center justify-center">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-md md:rounded-2xl rounded-t-3xl shadow-2xl overflow-hidden flex flex-col max-h-[751px] animate-in slide-in-from-bottom duration-300">
<!-- Modal Header -->
<div class="px-lg pt-lg pb-md flex items-center justify-between border-b border-surface-container-highest">
<div>
<h3 class="font-h1 text-h1 text-on-surface">Manage Categories</h3>
<p class="font-body-sm text-on-surface-variant">Organize your packing list tags</p>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-container transition-colors active:scale-90">
<span class="material-symbols-outlined text-outline" data-icon="close">close</span>
</button>
</div>
<!-- Modal Content (List of Categories) -->
<div class="flex-1 overflow-y-auto px-lg py-md space-y-md custom-scrollbar">
<!-- Category Row 1 -->
<div class="flex items-center gap-gutter group">
<div class="relative">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center cursor-pointer active:scale-90 transition-transform">
<span class="material-symbols-outlined text-white text-sm" data-icon="palette">palette</span>
</div>
</div>
<div class="flex-1">
<input class="w-full bg-surface-container-low border-none rounded-lg px-md py-sm font-body-base focus:ring-2 focus:ring-primary/20 text-on-surface" type="text" value="Clothing"/>
</div>
<button class="w-10 h-10 flex items-center justify-center text-outline hover:text-error hover:bg-error-container/20 rounded-full transition-all">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
<!-- Category Row 2 -->
<div class="flex items-center gap-gutter group">
<div class="relative">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center cursor-pointer active:scale-90 transition-transform">
<span class="material-symbols-outlined text-white text-sm" data-icon="palette">palette</span>
</div>
</div>
<div class="flex-1">
<input class="w-full bg-surface-container-low border-none rounded-lg px-md py-sm font-body-base focus:ring-2 focus:ring-primary/20 text-on-surface" type="text" value="Toiletries"/>
</div>
<button class="w-10 h-10 flex items-center justify-center text-outline hover:text-error hover:bg-error-container/20 rounded-full transition-all">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
<!-- Category Row 3 -->
<div class="flex items-center gap-gutter group">
<div class="relative">
<div class="w-10 h-10 rounded-full bg-tertiary-container flex items-center justify-center cursor-pointer active:scale-90 transition-transform">
<span class="material-symbols-outlined text-white text-sm" data-icon="palette">palette</span>
</div>
</div>
<div class="flex-1">
<input class="w-full bg-surface-container-low border-none rounded-lg px-md py-sm font-body-base focus:ring-2 focus:ring-primary/20 text-on-surface" type="text" value="Electronics"/>
</div>
<button class="w-10 h-10 flex items-center justify-center text-outline hover:text-error hover:bg-error-container/20 rounded-full transition-all">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
<!-- Category Row 4 -->
<div class="flex items-center gap-gutter group">
<div class="relative">
<div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center cursor-pointer active:scale-90 transition-transform">
<span class="material-symbols-outlined text-white text-sm" data-icon="palette">palette</span>
</div>
</div>
<div class="flex-1">
<input class="w-full bg-surface-container-low border-none rounded-lg px-md py-sm font-body-base focus:ring-2 focus:ring-primary/20 text-on-surface" type="text" value="Documents"/>
</div>
<button class="w-10 h-10 flex items-center justify-center text-outline hover:text-error hover:bg-error-container/20 rounded-full transition-all">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
<!-- Category Row 5 (Empty/New) -->
<div class="flex items-center gap-gutter opacity-60">
<div class="w-10 h-10 rounded-full bg-outline-variant/30 flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="add">add</span>
</div>
<div class="flex-1">
<input class="w-full bg-transparent border border-dashed border-outline-variant rounded-lg px-md py-sm font-body-base focus:ring-0 text-on-surface italic" placeholder="New Category Name..." type="text"/>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="p-lg border-t border-surface-container-highest bg-surface-container-lowest flex flex-col gap-sm">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-h2 flex items-center justify-center gap-2 active:scale-[0.98] transition-all hover:brightness-110 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
                    Add Category
                </button>
<button class="w-full h-12 bg-transparent text-primary font-body-base font-semibold flex items-center justify-center hover:bg-primary/5 rounded-xl transition-colors">
                    Done
                </button>
</div>
</div>
</div>
<!-- BottomNavBar (Suppressed for focused modal view, but styled per JSON) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 pt-2 pb-8 h-20 bg-white/90 dark:bg-zinc-950/90 backdrop-blur-lg rounded-t-2xl border-t border-slate-100 dark:border-zinc-800 shadow-[0_-4px_20px_rgba(0,0,0,0.03)] dark:shadow-none pointer-events-none opacity-20">
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-zinc-500 px-3 py-1 font-['Plus_Jakarta_Sans'] text-[11px] font-medium">
<span class="material-symbols-outlined mb-1" data-icon="task_alt">task_alt</span>
            Pack
        </div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-zinc-500 px-3 py-1 font-['Plus_Jakarta_Sans'] text-[11px] font-medium">
<span class="material-symbols-outlined mb-1" data-icon="luggage">luggage</span>
            Trips
        </div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-zinc-500 px-3 py-1 font-['Plus_Jakarta_Sans'] text-[11px] font-medium">
<span class="material-symbols-outlined mb-1" data-icon="group">group</span>
            Shared
        </div>
<div class="flex flex-col items-center justify-center text-blue-600 dark:text-blue-400 bg-blue-50/50 dark:bg-blue-900/20 rounded-xl px-3 py-1 font-['Plus_Jakarta_Sans'] text-[11px] font-medium">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
            Settings
        </div>
</nav>
</body></html>
